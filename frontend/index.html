<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CleanLink — клининговые компании вашего города</title>
    <meta
      name="description"
      content="CleanLink — сравнивайте рейтинг, цены и отзывы клининговых компаний и заказывайте уборку в пару кликов."
    />
    <!--
      Тема применяется к <html> ДО первой отрисовки (F11, docs/02-ux.md §6 "Микровзаимодействия":
      "без мигания дефолтной темой"). Инлайн-скрипт синхронный и выполняется раньше первого
      кадра рендера, поэтому FOUC отсутствует даже без JS-фреймворка.
    -->
    <script>
      (function () {
        try {
          var STORAGE_KEY = 'cleanlink-theme';
          var stored = window.localStorage.getItem(STORAGE_KEY);
          var theme = stored === 'dark' || stored === 'gradient' || stored === 'classic' ? stored : null;
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          // localStorage недоступен (приватный режим и т.п.) — тема упадёт на системную
          // через @media (prefers-color-scheme: dark) в design-tokens.css.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
